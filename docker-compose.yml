version: '3.9'

# Dev environment ตาม Sprint 0 (MVP_ExecutionPlan หัวข้อ 5): Dev/UAT/Production แยกกัน
# ไฟล์นี้คือ "Dev" — UAT/Production ตั้งค่าแยกใน CI/CD (ดู .github/workflows/ci.yml, ADR-0004)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medrota
      POSTGRES_PASSWORD: medrota
      POSTGRES_DB: medrota_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medrota']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    environment:
      # Override ค่า localhost ใน .env.example ด้วย hostname ของ container เครือข่าย
      # เดียวกัน (docker-compose `environment` มีสิทธิ์เหนือ `env_file` เสมอ)
      DATABASE_URL: postgresql://medrota:medrota@postgres:5432/medrota_dev?schema=public
      AI_SERVICE_BASE_URL: http://ai:8000
      REDIS_URL: redis://redis:6379
      AI_JOB_QUEUE_NAME: ai-jobs
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started

  ai:
    build:
      context: ./services/ai
    environment:
      REDIS_URL: redis://redis:6379
      AI_JOB_QUEUE_NAME: ai-jobs
    ports:
      - '8000:8000'
    depends_on:
      redis:
        condition: service_healthy

  # MVP 2 Sprint 5 (ADR-0002): process แยกจาก "ai" (uvicorn) — ดึงงาน FR-AI01 (Suggest /
  # Incremental Re-solve) จาก Queue "ai-jobs" บน Redis โดยตรง ไม่ผ่าน HTTP เลย ต้องแยก
  # service เพราะ app/worker.py เป็น asyncio loop ของตัวเอง รันพร้อม uvicorn ใน container
  # เดียวกันไม่ได้โดยไม่มี process manager เพิ่ม
  ai-worker:
    build:
      context: ./services/ai
    command: ['python', '-m', 'app.worker']
    environment:
      REDIS_URL: redis://redis:6379
      AI_JOB_QUEUE_NAME: ai-jobs
      AI_WORKER_CONCURRENCY: '2'
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    env_file:
      - ./apps/web/.env
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres_data:
